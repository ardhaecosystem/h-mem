[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmem"
version = "0.1.0"
description = "H-Mem: Hybrid agent memory with temporal-semantic tree + knowledge graph + adaptive retrieval"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["llm", "agent", "memory", "rag", "knowledge-graph", "long-term-memory"]
authors = [
  {name = "Humanth Shashani", email = "ardhaecosystem@gmail.com"},
  {name = "Veda", email = "veda@local"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
  "sentence-transformers>=3.0",
  "openai>=1.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
  "aiofiles>=23.2",
  "joblib>=1.4",
  "tqdm>=4.66",
  "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=4",
  "ipython>=8.24",
]
benchmarks = [
  "datasets>=2.19",
  "transformers>=4.41",
  "accelerate>=0.30",
]
all = [
  "hmem[dev,benchmarks]"
]

[project.urls]
Homepage = "https://github.com/ardhaecosystem/h-mem"
Documentation = "https://github.com/ardhaecosystem/h-mem/tree/main/docs"
Repository = "https://github.com/ardhaecosystem/h-mem"
Issues = "https://github.com/ardhaecosystem/h-mem/issues"

[project.scripts]
hmem = "hmem.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hmem"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = "src"

[tool.coverage.run]
source = ["src/hmem"]
branch = true
